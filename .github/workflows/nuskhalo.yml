name: NUSKHALO Daily Desi Health Shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "desi_topics.py"
      - "script.py"
      - "main.py"
      - "ai_video.py"
      - "video_engine.py"
      - "requirements.txt"
      - ".github/workflows/nuskhalo.yml"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: nuskhalo-daily-draft
  cancel-in-progress: false

jobs:
  build-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra libraqm0 libharfbuzz0b libfribidi0
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify Hindi shaping support
        run: python -c "from PIL import features; assert features.check('raqm'), 'Pillow RAQM support missing'; print('Hindi shaping OK')"
      - name: Build one Hindi test Short with realistic AI opening
        env:
          TZ: Asia/Kolkata
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          mkdir -p output
          set -o pipefail
          python -u main.py 2>&1 | tee output/build.log
      - name: Upload MP4 drafts, scripts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuskhalo-desi-health-shorts-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
