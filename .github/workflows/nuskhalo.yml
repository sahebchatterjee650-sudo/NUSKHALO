name: NUSKHALO Daily Draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "research.py"
      - "script.py"
      - "main.py"
      - "video_engine.py"
      - "requirements.txt"
      - ".github/workflows/nuskhalo.yml"
  schedule:
    # 08:30 India Standard Time (03:00 UTC)
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: nuskhalo-daily-draft
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build NUSKHALO video preview
        env:
          TZ: Asia/Kolkata
        run: |
          mkdir -p output
          set +e
          python -u main.py 2>&1 | tee output/build.log
          status=${PIPESTATUS[0]}
          echo "NUSKHALO_BUILD_EXIT_CODE=${status}" | tee -a output/build.log
          exit "${status}"

      - name: Upload draft, MP4 preview and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuskhalo-video-preview-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
