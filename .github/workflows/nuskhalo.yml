name: NUSKHALO Daily Draft

on:
  workflow_dispatch:
  schedule:
    # 08:30 India Standard Time (03:00 UTC)
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: nuskhalo-daily-draft
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build NUSKHALO draft
        env:
          TZ: Asia/Kolkata
        run: python main.py

      - name: Upload draft and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuskhalo-draft-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
