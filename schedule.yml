name: NUSKHALO draft builder
on:
  workflow_dispatch:
  schedule:
    # 08:30 IST = 03:00 UTC. GitHub schedule uses UTC.
    - cron: '0 3 * * *'
permissions:
  contents: read
jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build draft
        run: python main.py
      - name: Upload draft artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuskhalo-draft
          path: output/
          if-no-files-found: ignore
